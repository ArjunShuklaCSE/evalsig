name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Check that the tag matches the package version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/evalsig/__init__.py)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match __version__ $version"
            exit 1
          fi
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    # Trusted publishing: no API token. PyPI must list this repository, this workflow
    # (release.yml) and the "pypi" environment as a trusted publisher. Until that is set
    # up, leave the repository variable PUBLISH_TO_PYPI unset and this job is skipped.
    needs: build
    if: vars.PUBLISH_TO_PYPI == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/evalsig-stats
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    # Runs after PyPI when publishing there, and on its own when that job is skipped.
    needs: [build, pypi]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.pypi.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish the release with notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "evalsig $GITHUB_REF_NAME" --notes-file notes.md
