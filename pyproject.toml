[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evalsig-stats"
dynamic = ["version"]
description = "Tells you whether an AI eval change is really better or just noise."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "rich>=13",
    "scipy>=1.11",
    "typer>=0.12",
]
keywords = ["evaluation", "llm", "statistics", "bootstrap", "significance", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.scripts]
evalsig = "evalsig.cli:app"

[project.urls]
Homepage = "https://github.com/ArjunShuklaCSE/evalsig"
Documentation = "https://github.com/ArjunShuklaCSE/evalsig#readme"
Issues = "https://github.com/ArjunShuklaCSE/evalsig/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.version]
path = "src/evalsig/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/evalsig"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
